services:
  cassandra-node1:
    image: cassandra:4.1.10
    container_name: cassandra-node1
    hostname: cassandra-node1
    entrypoint: ["/bin/bash", "-c", "sed -i 's/^authenticator:.*/authenticator: PasswordAuthenticator/' \"$$CASSANDRA_CONF/cassandra.yaml\" && exec /usr/local/bin/docker-entrypoint.sh cassandra -f"]
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: dual-write-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra-node1
      CASSANDRA_NUM_TOKENS: 1
    volumes:
      - cassandra-node1-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -u cassandra -p cassandra -e 'DESCRIBE KEYSPACES' localhost 9042"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks:
      - cassandra-net

  cassandra-node2:
    image: cassandra:4.1.10
    container_name: cassandra-node2
    hostname: cassandra-node2
    entrypoint: ["/bin/bash", "-c", "sed -i 's/^authenticator:.*/authenticator: PasswordAuthenticator/' \"$$CASSANDRA_CONF/cassandra.yaml\" && exec /usr/local/bin/docker-entrypoint.sh cassandra -f"]
    depends_on:
      cassandra-node1:
        condition: service_healthy
    environment:
      CASSANDRA_CLUSTER_NAME: dual-write-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra-node1
      CASSANDRA_NUM_TOKENS: 1
    volumes:
      - cassandra-node2-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -u cassandra -p cassandra -e 'DESCRIBE KEYSPACES' localhost 9042"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks:
      - cassandra-net

  cassandra-node3:
    image: cassandra:4.1.10
    container_name: cassandra-node3
    hostname: cassandra-node3
    entrypoint: ["/bin/bash", "-c", "sed -i 's/^authenticator:.*/authenticator: PasswordAuthenticator/' \"$$CASSANDRA_CONF/cassandra.yaml\" && exec /usr/local/bin/docker-entrypoint.sh cassandra -f"]
    depends_on:
      cassandra-node2:
        condition: service_healthy
    environment:
      CASSANDRA_CLUSTER_NAME: dual-write-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra-node1
      CASSANDRA_NUM_TOKENS: 1
    volumes:
      - cassandra-node3-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -u cassandra -p cassandra -e 'DESCRIBE KEYSPACES' localhost 9042"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks:
      - cassandra-net

networks:
  cassandra-net:
    name: cassandra-net

volumes:
  cassandra-node1-data:
  cassandra-node2-data:
  cassandra-node3-data:
